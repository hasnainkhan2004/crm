<!DOCTYPE html>
<html>
<head>
    <title>Deals - CRM</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container py-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1>Deals</h1>
            <div>
                <a href="/" class="btn btn-secondary">Dashboard</a>
                <a href="{% url 'deal_add' %}" class="btn btn-primary">+ Add Deal</a>
            </div>
        </div>

        <form method="get" class="mb-4 row g-2">
            <div class="col-md-6">
                <input type="text" name="q" class="form-control" placeholder="Search by title..." value="{{ query }}">
            </div>
            <div class="col-md-4">
                <select name="stage" class="form-select">
                    <option value="">All Stages</option>
                    {% for value, label in stage_choices %}
                        <option value="{{ value }}" {% if stage_filter == value %}selected{% endif %}>{{ label }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="col-md-2">
                <button class="btn btn-outline-secondary w-100" type="submit">Filter</button>
            </div>
        </form>

        <div class="card">
            <table class="table mb-0">
                <thead>
                    <tr>
                        <th>Title</th>
                        <th>Contact</th>
                        <th>Stage</th>
                        <th>Value</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    {% for deal in deals %}
                    <tr>
                        <td>{{ deal.title }}</td>
                        <td>{{ deal.contact.name }}</td>
                        <td>
                            <span class="badge bg-info text-dark">{{ deal.get_stage_display }}</span>
                        </td>
                        <td>Rs {{ deal.value }}</td>
                        <td>
                            <a href="{% url 'deal_edit' deal.pk %}" class="btn btn-sm btn-outline-primary">Edit</a>
                            <a href="{% url 'deal_delete' deal.pk %}" class="btn btn-sm btn-outline-danger">Delete</a>
                        </td>
                    </tr>
                    {% empty %}
                    <tr><td colspan="5" class="text-center py-4">No deals yet.</td></tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
