<!DOCTYPE html>
<html>
<head>
    <title>{% block title %}CRM{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    {% block extra_head %}{% endblock %}
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand navbar-dark bg-dark px-4">
        <a class="navbar-brand" href="{% url 'dashboard' %}">📊 MyCRM</a>
        <div class="navbar-nav">
            <a class="nav-link text-white" href="{% url 'dashboard' %}">Dashboard</a>
            <a class="nav-link text-white" href="{% url 'contact_list' %}">Contacts</a>
            <a class="nav-link text-white" href="{% url 'deal_list' %}">Deals</a>
        </div>
        <div class="ms-auto">
            {% if user.is_authenticated %}
                <span class="text-white me-3">Hi, {{ user.username }}</span>
                <form method="post" action="{% url 'logout' %}" class="d-inline">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-outline-light btn-sm">Logout</button>
                </form>
            {% endif %}
        </div>
    </nav>

    <div class="container py-5">
        {% block content %}{% endblock %}
    </div>

    {% block extra_scripts %}{% endblock %}
</body>
</html>
