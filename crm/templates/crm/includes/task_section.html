<section class="card p-4 mb-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2 class="h4 mb-0">{{ title }}</h2>
        <a href="{{ add_url }}" class="btn btn-sm btn-primary">Add task</a>
    </div>
    {% for task in tasks %}
        {% include 'crm/includes/task_row.html' with task=task show_toggle=False %}
    {% empty %}
        <p class="text-muted mb-0">No pending tasks.</p>
    {% endfor %}
</section>
