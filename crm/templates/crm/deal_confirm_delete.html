<!DOCTYPE html>
<html>
<head>
    <title>Delete Deal - CRM</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container py-5">
        <div class="card p-4" style="max-width: 500px;">
            <h3 class="mb-3 text-danger">Delete Deal?</h3>
            <p>Are you sure you want to delete <strong>{{ deal.title }}</strong>? This cannot be undone.</p>
            <form method="post">
                {% csrf_token %}
                <button type="submit" class="btn btn-danger">Yes, Delete</button>
                <a href="{% url 'deal_list' %}" class="btn btn-secondary">Cancel</a>
            </form>
        </div>
    </div>
</body>
</html>
