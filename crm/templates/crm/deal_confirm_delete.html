{% extends 'crm/base.html' %}

{% block title %}Delete Deal{% endblock %}

{% block content %}
<div class="card p-4" style="max-width: 600px;">
    <h1 class="h3 mb-3 text-danger">Delete Deal?</h1>
    <p>Are you sure you want to delete <strong>{{ deal.title }}</strong>? This cannot be undone.</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Yes, Delete</button>
        <a href="{% url 'deal_list' %}" class="btn btn-secondary">Cancel</a>
    </form>
</div>
{% endblock %}
