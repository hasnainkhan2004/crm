<!DOCTYPE html>
<html>
<head>
    <title>Contacts - CRM</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container py-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1>Contacts</h1>
            <div>
                <a href="/" class="btn btn-secondary">Dashboard</a>
                <a href="{% url 'contact_add' %}" class="btn btn-primary">+ Add Contact</a>
            </div>
        </div>

        <form method="get" class="mb-4">
            <div class="input-group">
                <input type="text" name="q" class="form-control" placeholder="Search by name or company..." value="{{ query }}">
                <button class="btn btn-outline-secondary" type="submit">Search</button>
            </div>
        </form>

        <div class="card">
            <table class="table mb-0">
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Phone</th>
                        <th>Company</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    {% for contact in contacts %}
                    <tr>
                        <td><a href="{% url 'contact_detail' contact.pk %}">{{ contact.name }}</a></td>
                        <td>{{ contact.email }}</td>
                        <td>{{ contact.phone }}</td>
                        <td>{{ contact.company }}</td>
                        <td>
                            <a href="{% url 'contact_edit' contact.pk %}" class="btn btn-sm btn-outline-primary">Edit</a>
                            <a href="{% url 'contact_delete' contact.pk %}" class="btn btn-sm btn-outline-danger">Delete</a>
                        </td>
                    </tr>
                    {% empty %}
                    <tr><td colspan="5" class="text-center py-4">No contacts yet.</td></tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
