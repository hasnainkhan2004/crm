{% extends 'crm/base.html' %}

{% block title %}{{ title }}{% endblock %}

{% block content %}
<div class="card p-4" style="max-width: 700px;">
    <h1 class="h3 mb-3">{{ title }}</h1>
    {% if not has_contacts %}
        <div class="alert alert-info">
            Add a contact before creating a deal.
            <a href="{% url 'contact_add' %}" class="alert-link">Add a contact</a>.
        </div>
    {% endif %}
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary" {% if not has_contacts %}disabled{% endif %}>Save</button>
            <a href="{% url 'deal_list' %}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
