<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}MyCRM{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            min-height: 100vh;
            background: #f4f7fb;
        }
        .auth-card {
            max-width: 460px;
            border: 0;
            border-radius: 1rem;
            box-shadow: 0 1.25rem 3rem rgba(27, 45, 75, .12);
        }
        .brand-mark {
            display: inline-grid;
            width: 2.75rem;
            height: 2.75rem;
            place-items: center;
            border-radius: .85rem;
            color: #fff;
            background: #3457d5;
            font-weight: 700;
        }
        .form-control {
            min-height: 2.9rem;
        }
    </style>
</head>
<body>
    <main class="container min-vh-100 d-flex align-items-center justify-content-center py-5">
        <div class="card auth-card w-100 p-4 p-md-5">
            <header class="text-center mb-4">
                <span class="brand-mark mb-3">C</span>
                <h1 class="h3 fw-bold mb-1">{% block heading %}Welcome to MyCRM{% endblock %}</h1>
                <p class="text-secondary mb-0">{% block subheading %}Your customer relationships, organized.{% endblock %}</p>
            </header>
            {% block content %}{% endblock %}
        </div>
    </main>
</body>
</html>
