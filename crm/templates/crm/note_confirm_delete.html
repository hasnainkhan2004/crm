{% extends 'crm/base.html' %}

{% block title %}Delete Note{% endblock %}

{% block content %}
<div class="card p-4" style="max-width: 700px;">
    <h1 class="h3 mb-3 text-danger">Delete Note?</h1>
    <p>Are you sure you want to delete this note?</p>
    <blockquote class="border-start border-3 ps-3">{{ note.content|linebreaks }}</blockquote>
    <form method="post">
        {% csrf_token %}
        <input type="hidden" name="next" value="{{ return_url }}">
        <button type="submit" class="btn btn-danger">Yes, Delete</button>
        <a href="{{ return_url }}" class="btn btn-secondary">Cancel</a>
    </form>
</div>
{% endblock %}
